<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lamp Controller - PLC Star Night '26</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f1c40f 50%, #b38600 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg-gradient);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p { color: #d1b3ff; font-size: 1.1rem; margin-bottom: 35px; }

    .touch-btn {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: var(--gold-gradient);
      border: 6px solid rgba(255, 255, 255, 0.4);
      color: #120024;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 50px rgba(241, 196, 15, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .touch-btn:active { transform: scale(0.92); }

    .status-badge {
      margin-top: 30px;
      font-size: 1rem;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
    }

    .status-badge.connected .status-dot {
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .reset-btn {
      margin-top: 25px;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Digital Oil Lamp Ceremony</h1>
  <p>Touch the flame to light the lamp on stage</p>

  <button class="touch-btn" onclick="sendLight()">
    <span style="font-size: 4rem;">🔥</span>
    <span>LIGHT LAMP</span>
  </button>

  <div id="statusBadge" class="status-badge">
    <div class="status-dot"></div>
    <span id="statusText">Connecting...</span>
  </div>

  <div>
    <button class="reset-btn" onclick="sendReset()">Reset Ceremony</button>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://plc-star-night-lamp-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const lampRef = db.ref('lampState');

    let currentLitCount = 0;

    // Sync state automatically
    lampRef.on('value', (snapshot) => {
      document.getElementById('statusBadge').classList.add('connected');
      document.getElementById('statusText').innerText = "Ready to Light";
      currentLitCount = snapshot.val() || 0;
    });

    function sendLight() {
      if (currentLitCount < 15) {
        lampRef.set(currentLitCount + 1);
      }
    }

    function sendReset() {
      if (confirm("Reset lamp on stage?")) {
        lampRef.set(0);
      }
    }
  </script>

</body>
</html>
