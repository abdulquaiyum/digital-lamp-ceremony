<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lamp Controller - PLC Star Night '26</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f1c40f 50%, #b38600 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg-gradient);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p { color: #d1b3ff; font-size: 1.1rem; margin-bottom: 35px; }

    .touch-btn {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: var(--gold-gradient);
      border: 6px solid rgba(255, 255, 255, 0.4);
      color: #120024;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 50px rgba(241, 196, 15, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .touch-btn:active { transform: scale(0.92); }

    .status-badge {
      margin-top: 30px;
      font-size: 1rem;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
    }

    .status-badge.connected .status-dot {
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .reset-btn {
      margin-top: 25px;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Digital Oil Lamp Ceremony</h1>
  <p>Touch the flame to light the lamp on stage</p>

  <button class="touch-btn" onclick="sendLight()">
    <span style="font-size: 4rem;">🔥</span>
    <span>LIGHT LAMP</span>
  </button>

  <div id="statusBadge" class="status-badge">
    <div class="status-dot"></div>
    <span id="statusText">Connecting to stage screen...</span>
  </div>

  <div>
    <button class="reset-btn" onclick="sendReset()">Reset Ceremony</button>
  </div>

  <script>
    const FIXED_CHANNEL_ID = "plc-star-night-lamp-2026";
    let peer = null;
    let conn = null;

    function initAutoConnect() {
      peer = new Peer();

      peer.on('open', () => {
        attemptConnection();
      });

      peer.on('error', (err) => {
        console.log("Connection error, retrying...", err);
        setTimeout(attemptConnection, 2000);
      });
    }

    function attemptConnection() {
      conn = peer.connect(FIXED_CHANNEL_ID);

      conn.on('open', () => {
        const badge = document.getElementById('statusBadge');
        badge.classList.add('connected');
        document.getElementById('statusText').innerText = "Connected to Stage Screen";
      });

      conn.on('close', () => {
        const badge = document.getElementById('statusBadge');
        badge.classList.remove('connected');
        document.getElementById('statusText').innerText = "Disconnected. Reconnecting...";
        setTimeout(attemptConnection, 2000);
      });
    }

    function sendLight() {
      if (conn && conn.open) {
        conn.send({ action: 'LIGHT' });
      } else {
        alert("Connecting to stage screen... Please ensure the Stage Display page is open.");
      }
    }

    function sendReset() {
      if (conn && conn.open && confirm("Reset lamp on stage?")) {
        conn.send({ action: 'RESET' });
      }
    }

    // Auto connect on page load
    window.onload = initAutoConnect;
  </script>

</body>
</html>
