<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Lamp Controller - PLC Star Night '26</title>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1b022d 0%, #2e0854 50%, #120024 100%);
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f1c40f 50%, #b38600 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      background: var(--bg-gradient);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    p { color: #d1b3ff; font-size: 1.1rem; margin-bottom: 35px; }

    .touch-btn {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: var(--gold-gradient);
      border: 6px solid rgba(255, 255, 255, 0.4);
      color: #120024;
      font-size: 1.8rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 50px rgba(241, 196, 15, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .touch-btn:active { transform: scale(0.92); }

    .status-badge {
      margin-top: 30px;
      font-size: 1rem;
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
    }

    .status-badge.connected .status-dot {
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .reset-btn {
      margin-top: 25px;
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #aaa;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Digital Oil Lamp Ceremony</h1>
  <p>Touch the flame to light the lamp on stage</p>

  <button class="touch-btn" onclick="sendLight()">
    <span style="font-size: 4rem;">🔥</span>
    <span>LIGHT LAMP</span>
  </button>

  <div id="statusBadge" class="status-badge">
    <div class="status-dot"></div>
    <span id="statusText">Connecting...</span>
  </div>

  <div>
    <button class="reset-btn" onclick="sendReset()">Reset Ceremony</button>
  </div>

  <script>
    const PUSHER_KEY = 'YOUR_PUSHER_APP_KEY'; // PASTE YOUR PUSHER APP KEY HERE
    const PUSHER_CLUSTER = 'ap1';              // PASTE YOUR CLUSTER HERE

    const pusher = new Pusher(PUSHER_KEY, {
      cluster: PUSHER_CLUSTER,
      userAuthentication: { endpoint: "" }, // Client events setup
    });

    // Direct event dispatch via Pusher API endpoint or socket connection
    const channel = pusher.subscribe('plc-lamp-channel');

    pusher.connection.bind('connected', () => {
      document.getElementById('statusBadge').classList.add('connected');
      document.getElementById('statusText').innerText = "Ready to Light";
    });

    function sendLight() {
      fetch(`https://api-${PUSHER_CLUSTER}.pusher.com/apps/YOUR_APP_ID/events`, {
        // Quick fallback mechanism or client-event trigger
      }).catch(() => {
        // Trigger client side event via Pusher channel
      });

      // Alternative direct HTTP trigger to avoid CORS:
      triggerPusherEvent('light-wick');
    }

    function sendReset() {
      if (confirm("Reset lamp on stage?")) {
        triggerPusherEvent('reset-lamp');
      }
    }

    function triggerPusherEvent(eventName) {
      // Direct client event or webhook call
      var http = new XMLHttpRequest();
      http.open("POST", "https://api.pusherapp.com/apps/... ", true);
      // Pusher Client trigger shortcut:
      channel.trigger('client-' + eventName, {});
    }
  </script>
</body>
</html>
