<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - Digital Oil Lamp | PLC Kidz Got Talent 2026</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #2e0854 0%, #1a0636 50%, #0c001a 100%);
      --gold-gradient: linear-gradient(135deg, #fff2a3 0%, #f1c40f 40%, #e67e22 70%, #b38600 100%);
      --marquee-gradient: linear-gradient(135deg, #ff0055 0%, #ff5e00 50%, #ffb700 100%);
      --flame-outer: #ff4500;
      --flame-inner: #ffcc00;
      --flame-core: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-gradient);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }

    /* Vibrant Carnival Background Details */
    .carnival-bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 128, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(0, 212, 255, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(255, 215, 0, 0.15) 0%, transparent 50%);
      z-index: 0;
    }

    /* Carnival Bunting Streamers */
    .bunting-container {
      position: absolute;
      top: 0;
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: space-around;
      z-index: 1;
      pointer-events: none;
    }

    .bunting {
      width: 0;
      height: 0;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 45px solid #ff0055;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      animation: swing 3s infinite ease-in-out alternate;
    }

    .bunting:nth-child(2n) { border-top-color: #ffb700; animation-delay: 0.3s; }
    .bunting:nth-child(3n) { border-top-color: #00d4ff; animation-delay: 0.6s; }
    .bunting:nth-child(4n) { border-top-color: #00ff88; animation-delay: 0.9s; }
    .bunting:nth-child(5n) { border-top-color: #ff00aa; animation-delay: 1.2s; }

    @keyframes swing {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    .status-dot {
      position: absolute;
      top: 25px;
      right: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(46, 8, 84, 0.85);
      border: 1px solid rgba(241, 196, 15, 0.6);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.85rem;
      color: #ffe066;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
      transition: background 0.3s;
    }
    .dot.online { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

    .header {
      z-index: 2;
      margin-top: 10px;
    }

    .header h1 {
      font-size: 3.8rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      text-transform: uppercase;
    }

    .header p {
      font-size: 1.4rem;
      color: #00d4ff;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 6px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
    }

    .lamp-stage {
      position: relative;
      width: 550px;
      height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      z-index: 2;
    }

    .ambient-light {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 174, 0, 0.45) 0%, rgba(255, 0, 128, 0.2) 40%, transparent 75%);
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .brass-lamp { width: 100%; height: 100%; filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.95)); }
    .wicks-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

    .wick-spot {
      position: absolute;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .wick-dot { width: 6px; height: 10px; background: #4a3b2c; border-radius: 3px 3px 0 0; }

    .flame {
      width: 20px;
      height: 36px;
      background: linear-gradient(to top, var(--flame-outer) 20%, var(--flame-inner) 70%, var(--flame-core) 100%);
      border-radius: 50% 50% 20% 20% / 80% 80% 30% 30%;
      box-shadow: 0 0 15px #ff6600, 0 0 30px #ffcc00, 0 0 40px #ff0055;
      opacity: 0;
      transform: scale(0.2) translateY(10px);
      transform-origin: center bottom;
      transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: flicker 0.15s infinite alternate ease-in-out;
    }

    .wick-spot.lit .flame { opacity: 1; transform: scale(1) translateY(0); }
    .wick-spot.lit .wick-dot { background: #ffcc00; box-shadow: 0 0 8px #ff9900; }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1.5deg); }
      100% { transform: scale(1.06) rotate(1.5deg); }
    }

    /* Carnival Counter Badge */
    .status-counter {
      font-size: 1.5rem;
      color: #ffffff;
      letter-spacing: 2px;
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.3), rgba(46, 8, 84, 0.8));
      padding: 10px 28px;
      border-radius: 30px;
      border: 2px solid rgba(255, 215, 0, 0.6);
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.4);
      z-index: 2;
    }

    .status-counter strong { color: #ffe066; font-size: 2.2rem; text-shadow: 0 0 10px #ffcc00; }
  </style>
</head>
<body>

  <div class="carnival-bg-overlay"></div>

  <!-- Carnival Streamers -->
  <div class="bunting-container">
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
  </div>

  <div class="status-dot">
    <div class="dot" id="connDot"></div>
    <span id="connText">Connecting...</span>
  </div>

  <div class="header">
    <h1>PLC Kidz Got Talent 2026</h1>
    <p>Digital Oil Lamp Ceremony</p>
  </div>

  <div class="lamp-stage">
    <div id="ambientLight" class="ambient-light"></div>
    <svg class="brass-lamp" viewBox="0 0 500 500">
      <defs>
        <radialGradient id="brassGrad" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fff0aa"/>
          <stop offset="30%" stop-color="#d4af37"/>
          <stop offset="70%" stop-color="#8a640f"/>
          <stop offset="100%" stop-color="#3d2900"/>
        </radialGradient>
      </defs>
      <ellipse cx="250" cy="450" rx="110" ry="22" fill="url(#brassGrad)"/>
      <path d="M220 450 Q250 430 280 450 L270 380 L230 380 Z" fill="url(#brassGrad)"/>
      <path d="M235 380 Q250 340 235 300 L265 300 Q250 340 265 380 Z" fill="url(#brassGrad)"/>
      <ellipse cx="250" cy="300" rx="25" ry="8" fill="url(#brassGrad)"/>
      <path d="M230 300 Q250 250 230 200 L270 200 Q250 250 270 300 Z" fill="url(#brassGrad)"/>
      <ellipse cx="250" cy="200" rx="170" ry="50" fill="url(#brassGrad)"/>
      <ellipse cx="250" cy="196" rx="155" ry="42" fill="#291a00"/>
      <path d="M242 196 Q250 140 240 100 Q250 70 250 50 Q250 70 260 100 Q250 140 258 196 Z" fill="url(#brassGrad)"/>
      <circle cx="250" cy="45" r="10" fill="url(#brassGrad)"/>
    </svg>
    <div id="wicksContainer" class="wicks-container"></div>
  </div>

  <div class="status-counter">
    Lit Wicks: <strong id="litCount">0</strong> / 15
  </div>

  <script>
    const TOTAL_WICKS = 15;
    let litCount = 0;

    // Public HiveMQ broker (Secure WebSockets over port 8884)
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
    const TOPIC = 'plc_star_night_2026/lamp_control';

    client.on('connect', () => {
      document.getElementById('connDot').classList.add('online');
      document.getElementById('connText').innerText = "Live Ready";
      client.subscribe(TOPIC);
    });

    client.on('message', (topic, message) => {
      const command = message.toString();
      if (command === 'LIGHT') {
        lightNextWick();
      } else if (command === 'RESET') {
        resetLamp();
      }
    });

    function initWicks() {
      const wicksContainer = document.getElementById('wicksContainer');
      const centerX = 275; const centerY = 196; const radiusX = 155; const radiusY = 42;
      
      for (let i = 0; i < TOTAL_WICKS; i++) {
        const angle = (i * (2 * Math.PI / TOTAL_WICKS)) - (Math.PI / 2);
        const x = centerX + radiusX * Math.cos(angle);
        const y = centerY + radiusY * Math.sin(angle);

        const wick = document.createElement('div');
        wick.className = 'wick-spot';
        wick.style.left = `${x}px`;
        wick.style.top = `${y}px`;
        wick.id = `wick-${i}`;
        wick.innerHTML = `<div class="flame"></div><div class="wick-dot"></div>`;
        wicksContainer.appendChild(wick);
      }
    }

    function lightNextWick() {
      if (litCount < TOTAL_WICKS) {
        const wick = document.getElementById(`wick-${litCount}`);
        if (wick) {
          wick.classList.add('lit');
          litCount++;
          updateState();
        }
      }
    }

    function resetLamp() {
      litCount = 0;
      document.querySelectorAll('.wick-spot').forEach(w => w.classList.remove('lit'));
      updateState();
    }

    function updateState() {
      document.getElementById('litCount').innerText = litCount;
      document.getElementById('ambientLight').style.opacity = (litCount / TOTAL_WICKS) * 0.95;
    }

    initWicks();
  </script>
</body>
</html>
