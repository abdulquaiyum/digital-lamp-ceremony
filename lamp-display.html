<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage Display - Digital Oil Lamp | PLC Kidz Got Talent 2026</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #370a66 0%, #1a0636 55%, #0a0018 100%);
      --gold-gradient: linear-gradient(135deg, #fff2a3 0%, #f1c40f 40%, #e67e22 70%, #b38600 100%);
      --flame-outer: #ff4500;
      --flame-inner: #ffcc00;
      --flame-core: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-gradient);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px 25px;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }

    /* Vibrant Carnival Background Overlay */
    .carnival-bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 128, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(0, 212, 255, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(255, 215, 0, 0.18) 0%, transparent 50%);
      z-index: 0;
    }

    /* Festive Carnival Bunting Streamers */
    .bunting-container {
      position: absolute;
      top: 0;
      width: 100%;
      height: 50px;
      display: flex;
      justify-content: space-around;
      z-index: 1;
      pointer-events: none;
    }

    .bunting {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 40px solid #ff0055;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      animation: swing 3s infinite ease-in-out alternate;
    }

    .bunting:nth-child(2n) { border-top-color: #ffb700; animation-delay: 0.3s; }
    .bunting:nth-child(3n) { border-top-color: #00d4ff; animation-delay: 0.6s; }
    .bunting:nth-child(4n) { border-top-color: #00ff88; animation-delay: 0.9s; }
    .bunting:nth-child(5n) { border-top-color: #ff00aa; animation-delay: 1.2s; }

    @keyframes swing {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }

    .status-dot {
      position: absolute;
      top: 15px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(46, 8, 84, 0.85);
      border: 1.5px solid rgba(241, 196, 15, 0.6);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #ffe066;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
      transition: background 0.3s;
    }
    .dot.online { background: #2ecc71; box-shadow: 0 0 10px #2ecc71; }

    .header {
      z-index: 2;
      margin-top: 5px;
    }

    .header h1 {
      font-size: 3.4rem;
      font-weight: 900;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
      text-transform: uppercase;
    }

    .header p {
      font-size: 1.3rem;
      color: #00d4ff;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 2px;
      font-weight: 700;
      text-shadow: 0 0 12px rgba(0, 212, 255, 0.6);
    }

    /* EXTRA ENLARGED LAMP STAGE CONTAINER */
    .lamp-stage {
      position: relative;
      width: 860px;
      height: 860px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: -50px auto -30px auto;
      z-index: 2;
    }

    .ambient-light {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 180, 0, 0.55) 0%, rgba(255, 0, 128, 0.25) 45%, transparent 75%);
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .brass-lamp { 
      width: 100%; 
      height: 100%; 
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.95)); 
    }
    
    .wicks-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

    .wick-spot {
      position: absolute;
      width: 56px;
      height: 56px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .wick-dot { width: 8px; height: 14px; background: #3a2b1c; border-radius: 3px 3px 0 0; }

    .flame {
      width: 28px;
      height: 50px;
      background: linear-gradient(to top, var(--flame-outer) 20%, var(--flame-inner) 70%, var(--flame-core) 100%);
      border-radius: 50% 50% 20% 20% / 80% 80% 30% 30%;
      box-shadow: 0 0 20px #ff6600, 0 0 40px #ffcc00, 0 0 60px #ff0055;
      opacity: 0;
      transform: scale(0.2) translateY(14px);
      transform-origin: center bottom;
      transition: opacity 0.5s ease-out, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: flicker 0.15s infinite alternate ease-in-out;
    }

    .wick-spot.lit .flame { opacity: 1; transform: scale(1) translateY(0); }
    .wick-spot.lit .wick-dot { background: #ffcc00; box-shadow: 0 0 12px #ff9900; }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-1.5deg); }
      100% { transform: scale(1.08) rotate(1.5deg); }
    }

    /* Carnival Counter Badge */
    .status-counter {
      font-size: 1.4rem;
      color: #ffffff;
      letter-spacing: 2px;
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.35), rgba(46, 8, 84, 0.85));
      padding: 8px 30px;
      border-radius: 30px;
      border: 2px solid rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 25px rgba(255, 0, 128, 0.4);
      z-index: 2;
      margin-bottom: 5px;
    }

    .status-counter strong { color: #ffe066; font-size: 2.1rem; text-shadow: 0 0 12px #ffcc00; }
  </style>
</head>
<body>

  <div class="carnival-bg-overlay"></div>

  <!-- Carnival Streamers -->
  <div class="bunting-container">
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
    <div class="bunting"></div><div class="bunting"></div>
  </div>

  <div class="status-dot">
    <div class="dot" id="connDot"></div>
    <span id="connText">Connecting...</span>
  </div>

  <div class="header">
    <h1>PLC Kidz Got Talent 2026</h1>
    <p>Digital Oil Lamp Ceremony</p>
  </div>

  <!-- MAXIMIZED ORNATE BRASS PANA LAMP -->
  <div class="lamp-stage">
    <div id="ambientLight" class="ambient-light"></div>
    <svg class="brass-lamp" viewBox="0 0 700 700">
      <defs>
        <!-- Gold Shimmer Gradient -->
        <radialGradient id="brassGrad" cx="35%" cy="25%" r="75%">
          <stop offset="0%" stop-color="#ffffc2"/>
          <stop offset="25%" stop-color="#ffd700"/>
          <stop offset="55%" stop-color="#caa024"/>
          <stop offset="85%" stop-color="#7a5505"/>
          <stop offset="100%" stop-color="#382200"/>
        </radialGradient>
        <linearGradient id="brassHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#d4af37"/>
          <stop offset="100%" stop-color="#543900"/>
        </linearGradient>
        <radialGradient id="bowlInner" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#523908"/>
          <stop offset="70%" stop-color="#241700"/>
          <stop offset="100%" stop-color="#0f0900"/>
        </radialGradient>
      </defs>

      <!-- Multi-tier Ornate Base -->
      <ellipse cx="350" cy="650" rx="195" ry="32" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="642" rx="170" ry="26" fill="url(#brassHighlight)" opacity="0.6"/>
      <ellipse cx="350" cy="635" rx="145" ry="21" fill="url(#brassGrad)"/>
      <path d="M295 635 Q350 600 405 635 L388 535 L312 535 Z" fill="url(#brassGrad)"/>
      
      <!-- Lower Pillar Rings & Knobs -->
      <ellipse cx="350" cy="535" rx="42" ry="12" fill="url(#brassGrad)"/>
      <path d="M322 535 Q350 488 322 440 L378 440 Q350 488 378 535 Z" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="440" rx="50" ry="14" fill="url(#brassGrad)"/>

      <!-- Mid Saucer Tray -->
      <ellipse cx="350" cy="440" rx="105" ry="26" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="435" rx="95" ry="21" fill="url(#bowlInner)"/>

      <!-- Upper Column Stem -->
      <path d="M326 435 Q350 345 326 280 L374 280 Q350 345 374 435 Z" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="280" rx="38" ry="11" fill="url(#brassGrad)"/>

      <!-- Main Oil Bowl (Maximized) -->
      <ellipse cx="350" cy="280" rx="270" ry="75" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="274" rx="250" ry="63" fill="url(#brassGrad)"/>
      <ellipse cx="350" cy="272" rx="240" ry="58" fill="url(#bowlInner)"/>

      <!-- Center Ornate Pillar & Crown Finial -->
      <path d="M338 272 Q350 180 334 125 Q350 85 350 45 Q350 85 366 125 Q350 180 362 272 Z" fill="url(#brassGrad)"/>
      <circle cx="350" cy="125" r="19" fill="url(#brassGrad)"/>
      <circle cx="350" cy="85" r="14" fill="url(#brassGrad)"/>
      <!-- Decorative Flame Crest Finial Top -->
      <path d="M350 20 C338 38 344 55 350 70 C356 55 362 38 350 20 Z" fill="url(#brassHighlight)"/>
    </svg>
    <div id="wicksContainer" class="wicks-container"></div>
  </div>

  <div class="status-counter">
    Lit Wicks: <strong id="litCount">0</strong> / 15
  </div>

  <script>
    const TOTAL_WICKS = 15;
    let litCount = 0;

    // Public HiveMQ broker (Secure WebSockets over port 8884)
    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
    const TOPIC = 'plc_star_night_2026/lamp_control';

    client.on('connect', () => {
      document.getElementById('connDot').classList.add('online');
      document.getElementById('connText').innerText = "Live Ready";
      client.subscribe(TOPIC);
    });

    client.on('message', (topic, message) => {
      const command = message.toString();
      if (command === 'LIGHT') {
        lightNextWick();
      } else if (command === 'RESET') {
        resetLamp();
      }
    });

    function initWicks() {
      const wicksContainer = document.getElementById('wicksContainer');
      // Coordinates for 860x860 container (viewBox 700x700 scaled)
      const centerX = 430; 
      const centerY = 340; 
      const radiusX = 285; 
      const radiusY = 68;
      
      for (let i = 0; i < TOTAL_WICKS; i++) {
        const angle = (i * (2 * Math.PI / TOTAL_WICKS)) - (Math.PI / 2);
        const x = centerX + radiusX * Math.cos(angle);
        const y = centerY + radiusY * Math.sin(angle);

        const wick = document.createElement('div');
        wick.className = 'wick-spot';
        wick.style.left = `${x}px`;
        wick.style.top = `${y}px`;
        wick.id = `wick-${i}`;
        wick.innerHTML = `<div class="flame"></div><div class="wick-dot"></div>`;
        wicksContainer.appendChild(wick);
      }
    }

    function lightNextWick() {
      if (litCount < TOTAL_WICKS) {
        const wick = document.getElementById(`wick-${litCount}`);
        if (wick) {
          wick.classList.add('lit');
          litCount++;
          updateState();
        }
      }
    }

    function resetLamp() {
      litCount = 0;
      document.querySelectorAll('.wick-spot').forEach(w => w.classList.remove('lit'));
      updateState();
    }

    function updateState() {
      document.getElementById('litCount').innerText = litCount;
      document.getElementById('ambientLight').style.opacity = (litCount / TOTAL_WICKS) * 0.95;
    }

    initWicks();
  </script>
</body>
</html>
